<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ED1B2F">
<meta name="robots" content="noindex">
<title>Martlets Coverage 2026-27</title>
<style>
/* ============================================================
   Design tokens. Status colour comes in two tones — a strong one
   for text/borders (contrast-safe) and a soft tint for fills — so
   nothing depends on colour alone and both themes stay legible.
   ============================================================ */
:root {
  --brand:#ED1B2F;
  --ok:#41701F;      --ok-tint:#EDF4E3;   --ok-line:#B9CF97;
  --warn:#8F5115;    --warn-tint:#FBF0E3; --warn-line:#E0B584;
  --bad:#C20E25;     --bad-tint:#FDEAEC;  --bad-line:#F0A7B0;

  --bg:#FAFAF9;  --surface:#FFFFFF;  --raised:#FFFFFF;
  --ink:#16181D; --ink-2:#4A525E;    --ink-3:#6B7480;
  --line:#E5E4E1; --line-2:#D3D2CE;
  --focus:#0B57D0;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --shadow-1:0 1px 2px rgba(16,18,22,.06), 0 1px 1px rgba(16,18,22,.04);
  --shadow-2:0 4px 16px rgba(16,18,22,.10);
  --tap:44px;
  --dur:180ms; --ease:cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand:#FF5266;
    --ok:#A8CC72;      --ok-tint:#232A1A;   --ok-line:#42542A;
    --warn:#E5A868;    --warn-tint:#2C2118; --warn-line:#5C4227;
    --bad:#FF7285;     --bad-tint:#31161B;  --bad-line:#6B2B34;

    --bg:#111214;  --surface:#1A1C20;  --raised:#212429;
    --ink:#EFEFEE; --ink-2:#B7BEC7;    --ink-3:#8E97A2;
    --line:#2B2F36; --line-2:#3A3F47;
    --focus:#A8C7FA;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 6px 20px rgba(0,0,0,.5);
  }
}

*, *::before, *::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0;
  font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size:15px; line-height:1.5; color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3 { margin:0; line-height:1.25; text-wrap:balance; }
button, input { font:inherit; color:inherit; }
button { -webkit-tap-highlight-color:transparent; }
svg { display:block; }
.tnum { font-variant-numeric:tabular-nums; }

/* focus: always visible, never removed */
:focus-visible {
  outline:3px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm);
}

/* ---------- shell ---------- */
.wrap {
  max-width:780px; margin:0 auto;
  padding:0 var(--sp-4) calc(var(--sp-6) + env(safe-area-inset-bottom));
}
/* The title block scrolls away; only the tab strip sticks, which keeps a
   375px screen from losing 150px of height to a header. */
.topbar { padding-top:env(safe-area-inset-top); }
.topbar-in { max-width:780px; margin:0 auto; padding:var(--sp-4) var(--sp-4) 0; }
.brandline {
  display:flex; align-items:center; gap:var(--sp-2);
  font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--brand); margin:0 0 2px;
}
.brandline::before {
  content:""; width:16px; height:3px; border-radius:2px; background:var(--brand);
}
h1 { font-size:20px; letter-spacing:-.01em; }
.idline { font-size:13px; color:var(--ink-3); margin:2px 0 var(--sp-3); }
.linkbtn {
  display:inline-flex; align-items:center; min-height:var(--tap);
  border:none; background:none; color:var(--brand); font-weight:600; font-size:13px;
  padding:0 6px; margin:0 -6px; cursor:pointer; border-radius:var(--r-sm);
}
.linkbtn:hover { text-decoration:underline; }

/* tabs — horizontally scrollable, each a full tap target */
.tabs {
  position:sticky; top:0; z-index:40;
  display:flex; gap:var(--sp-1); overflow-x:auto; scrollbar-width:none;
  margin:0 calc(var(--sp-4) * -1); padding:0 var(--sp-4);
  background:var(--bg); border-bottom:1px solid var(--line);
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  flex:0 0 auto; min-height:var(--tap); padding:0 var(--sp-3);
  border:none; background:none; color:var(--ink-3);
  font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;
  border-bottom:3px solid transparent; transition:color var(--dur) var(--ease);
}
.tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--brand); }
.tab:hover { color:var(--ink); }
.tab, .more-btn { display:inline-flex; align-items:center; gap:6px; }
.tab svg, .more-btn svg { width:20px; height:20px; flex:0 0 auto; }
.more-btn { display:none; border:none; background:none; color:var(--ink-3); font:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; }

/* Phones: the tab strip becomes a fixed bottom bar (5 slots) and the secondary
   views move into a "More" sheet above it. Desktop keeps the top strip. */
@media (max-width:640px) {
  .tabs {
    position:fixed; top:auto; bottom:0; left:0; right:0; z-index:50;
    display:grid; grid-template-columns:repeat(5, 1fr); gap:0;
    margin:0; padding:4px 4px calc(4px + env(safe-area-inset-bottom));
    overflow:visible; background:var(--surface);
    border-top:1px solid var(--line); border-bottom:none;
    box-shadow:0 -4px 16px rgba(16,18,22,.06);
  }
  .tabs .tab, .more-btn {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    min-height:54px; padding:6px 2px; border-bottom:none; border-radius:var(--r-sm);
    font-size:10.5px; font-weight:600; letter-spacing:.01em; color:var(--ink-3);
  }
  .tabs .tab svg, .more-btn svg { width:22px; height:22px; }
  .tabs .tab[aria-selected="true"], .more-btn[aria-selected="true"] { color:var(--brand); }
  .tabs .tab[aria-selected="true"] svg, .more-btn[aria-selected="true"] svg { stroke-width:2.4; }
  .tabs .tab:active, .more-btn:active { background:color-mix(in srgb, var(--brand) 10%, transparent); }
  .wrap { padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
  #toast { bottom:calc(84px + env(safe-area-inset-bottom)); }
  #more-sheet {
    position:fixed; left:var(--sp-3); right:var(--sp-3);
    bottom:calc(72px + env(safe-area-inset-bottom)); z-index:55;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--shadow-2); padding:var(--sp-2);
    display:grid; grid-template-columns:repeat(2, 1fr); gap:var(--sp-1);
    animation:rise var(--dur) var(--ease);
  }
  #more-sheet .tab {
    display:flex; flex-direction:row; justify-content:flex-start; gap:var(--sp-3);
    min-height:var(--tap); padding:0 var(--sp-3); border:none; border-radius:var(--r-sm);
    font-size:14px; font-weight:600; color:var(--ink-2);
  }
  #more-sheet .tab svg { width:20px; height:20px; }
  #more-sheet .tab[aria-selected="true"] { color:var(--brand); background:color-mix(in srgb, var(--brand) 10%, transparent); }
}

/* ---------- generic pieces ---------- */
.card {
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow-1);
}
h2.sec {
  font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); margin:var(--sp-5) 0 var(--sp-2);
}
.muted { font-size:13px; color:var(--ink-3); }
.muted.tight { margin:2px 0 0; }
p { margin:0 0 var(--sp-3); }
.stack > * + * { margin-top:var(--sp-2); }

/* ---------- alert (sticky, top of every tab) ---------- */
.urgent {
  display:flex; gap:var(--sp-3); align-items:flex-start;
  background:var(--bad-tint); border:1px solid var(--bad-line);
  border-left:4px solid var(--bad);
  border-radius:var(--r); padding:var(--sp-3) var(--sp-4); margin:var(--sp-4) 0 0;
}
.urgent svg { flex:0 0 auto; width:20px; height:20px; color:var(--bad); margin-top:1px; }
.urgent b { display:block; font-size:14px; color:var(--ink); }
.urgent ul { margin:var(--sp-1) 0 0; padding-left:18px; font-size:13px; color:var(--ink-2); }
.urgent li { margin:2px 0; }

/* ---------- stats ---------- */
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-2); margin-top:var(--sp-4); }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:var(--sp-3); }
.stat b { display:block; font-size:24px; font-weight:700; letter-spacing:-.02em; }
.stat span {
  display:block; font-size:11px; font-weight:600; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-3); margin-top:2px;
}
.stat.bad b { color:var(--bad); } .stat.warn b { color:var(--warn); } .stat.ok b { color:var(--ok); }
@media (max-width:560px) { .stats { grid-template-columns:repeat(2,1fr); } }

/* ---------- event card ---------- */
.row {
  background:var(--surface); border:1px solid var(--line);
  border-left:4px solid var(--line-2);
  border-radius:var(--r); padding:var(--sp-3) var(--sp-4); margin-top:var(--sp-2);
  box-shadow:var(--shadow-1);
}
.row.st-uncovered { border-left-color:var(--bad);  background:var(--bad-tint); }
.row.st-partial   { border-left-color:var(--warn); background:var(--warn-tint); }
.row.st-covered   { border-left-color:var(--ok);   background:var(--ok-tint); }
.row.ctx { background:var(--bg); border-left-color:var(--line-2); }
.row.ctx .rname { color:var(--ink-3); }
.rtop { display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--sp-2) var(--sp-3); }
.rdate { font-size:14px; font-weight:700; white-space:nowrap; }
.rtime { font-size:13px; color:var(--ink-2); white-space:nowrap; }
.rname { flex:1 1 60%; font-size:15px; }
.row.major .rname { font-weight:700; }
.cnt { font-size:13px; font-weight:600; color:var(--ink-2); }
.note { font-size:13px; color:var(--ink-2); margin-top:var(--sp-1); }
.note b { color:var(--ink); }

.badge {
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  padding:4px 9px; border-radius:var(--r-pill); white-space:nowrap;
  border:1px solid transparent;
}
.badge::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
.b-bad  { color:var(--bad);  background:var(--bad-tint);  border-color:var(--bad-line); }
.b-warn { color:var(--warn); background:var(--warn-tint); border-color:var(--warn-line); }
.b-ok   { color:var(--ok);   background:var(--ok-tint);   border-color:var(--ok-line); }
.b-gry  { color:var(--ink-3); background:transparent; border-color:var(--line-2); }
.b-gry::before { background:var(--ink-3); }

.av-free { font-size:13px; color:var(--ink-2); margin-top:var(--sp-1); }
.av-free.none { color:var(--bad); font-weight:600; }

/* ---------- name chips ---------- */
.chips { display:flex; flex-wrap:wrap; gap:var(--sp-2); margin-top:var(--sp-3); }
.chip {
  display:inline-flex; align-items:center; gap:6px;
  min-height:var(--tap); padding:0 var(--sp-4);
  border:1.5px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  border-radius:var(--r-pill); font-size:14px; font-weight:600; cursor:pointer;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease),
             border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.chip svg { width:15px; height:15px; opacity:0; transition:opacity var(--dur) var(--ease); }
.chip[aria-pressed="true"] { background:var(--ok); border-color:var(--ok); color:#fff; }
.chip[aria-pressed="true"] svg { opacity:1; }
.chip.me { border-style:solid; border-color:var(--ink); }
.chip.me[aria-pressed="true"] { border-color:var(--ok); }
.chip:not(:disabled):active { transform:scale(.97); }
.chip:disabled { opacity:.45; cursor:default; }
.chip.pending { opacity:.55; cursor:progress; }

/* ---------- filters ---------- */
.filters { display:flex; flex-wrap:wrap; gap:var(--sp-2); margin:var(--sp-4) 0 var(--sp-2); }
.fbtn {
  min-height:var(--tap); padding:0 var(--sp-4);
  border:1.5px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  border-radius:var(--r-pill); font-size:13px; font-weight:600; cursor:pointer;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.fbtn[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--bg); }

/* ---------- month header ---------- */
.mh {
  display:flex; justify-content:space-between; align-items:baseline; gap:var(--sp-3);
  margin:var(--sp-5) 0 var(--sp-2); padding-bottom:var(--sp-2);
  border-bottom:2px solid var(--line-2);
}
.mh h2 { font-size:17px; }
.mstat { font-size:12px; color:var(--ink-3); white-space:nowrap; }

/* ---------- calendar ---------- */
.cal-top {
  display:flex; align-items:center; justify-content:space-between;
  gap:var(--sp-2); margin:var(--sp-4) 0 var(--sp-3);
}
.cal-top h2 { font-size:19px; }
.iconbtn {
  display:grid; place-items:center;
  width:var(--tap); height:var(--tap); flex:0 0 auto;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  border-radius:var(--r); cursor:pointer;
  transition:background var(--dur) var(--ease);
}
.iconbtn svg { width:20px; height:20px; }
.iconbtn:not(:disabled):active { background:var(--line); }
.iconbtn:disabled { opacity:.35; cursor:default; }

.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:var(--sp-1); }
.cal-h {
  font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-3); text-align:center; padding-bottom:var(--sp-1);
}
.day {
  display:flex; flex-direction:column; align-items:stretch; gap:1px;
  min-height:62px; padding:5px 4px 6px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:var(--r-sm); text-align:left; cursor:pointer; overflow:hidden;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.day.empty { background:transparent; border-color:transparent; cursor:default; }
.day.none  { cursor:default; }
.day.st-uncovered { background:var(--bad-tint);  border-color:var(--bad-line); }
.day.st-partial   { background:var(--warn-tint); border-color:var(--warn-line); }
.day.st-covered   { background:var(--ok-tint);   border-color:var(--ok-line); }
.day.st-ctx       { background:var(--bg); }
.day.today { box-shadow:inset 0 0 0 2px var(--brand); }
.day[aria-pressed="true"] { box-shadow:inset 0 0 0 2px var(--ink); }
.day:not(.empty):not(.none):active { transform:scale(.96); }
.dnum { font-size:13px; font-weight:700; line-height:1.1; }
.day.today .dnum { color:var(--bad); }   /* darker than brand red: passes 4.5:1 at 13px */
.dline { font-size:11px; line-height:1.25; color:var(--ink-2); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.dcount { font-size:11px; font-weight:700; margin-top:auto; }
.day.st-uncovered .dcount { color:var(--bad); }
.day.st-partial   .dcount { color:var(--warn); }
.day.st-covered   .dcount { color:var(--ok); }
@media (max-width:400px) {
  .day { min-height:58px; padding:4px 3px 5px; }
}
.legend { display:flex; flex-wrap:wrap; gap:var(--sp-2) var(--sp-4); margin-top:var(--sp-3); }
.lg { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); }
.lg i { width:12px; height:12px; border-radius:3px; border:1px solid; }
.lg.bad i  { background:var(--bad-tint);  border-color:var(--bad-line); }
.lg.warn i { background:var(--warn-tint); border-color:var(--warn-line); }
.lg.ok i   { background:var(--ok-tint);   border-color:var(--ok-line); }
.lg.gry i  { background:var(--bg);        border-color:var(--line-2); }
.cal-detail { margin-top:var(--sp-5); padding-top:var(--sp-3); border-top:2px solid var(--line-2); }
.cal-detail h3 { font-size:16px; margin-bottom:var(--sp-2); }

/* ---------- audit ---------- */
.audit-item {
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--line-2);
  border-radius:var(--r-sm); padding:var(--sp-2) var(--sp-3); margin-top:var(--sp-2); font-size:13.5px;
}
.audit-item.bad { background:var(--bad-tint); border-left-color:var(--bad); }
.audit-when { display:block; color:var(--ink-3); font-size:12px; margin-top:2px; }

/* ---------- table ---------- */
.tblwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table.data { border-collapse:collapse; width:100%; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
table.data th, table.data td { border-bottom:1px solid var(--line); padding:10px 12px;
  font-size:14px; text-align:left; }
table.data th { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-3); background:var(--bg); }
table.data tr:last-child td { border-bottom:none; }
/* A numeric column's header must sit over its own figures, not at the far
   left of the column. Header and cells share the alignment and the width. */
table.data th.n, table.data td.n { text-align:right; width:74px; }
table.data td.n { font-variant-numeric:tabular-nums; font-weight:600; }

/* ---------- resources ---------- */
a.btn { display:inline-flex; align-items:center; text-decoration:none; }
.res-intro { font-size:14.5px; max-width:66ch; }
.ther {
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:var(--sp-3) var(--sp-4); margin-top:var(--sp-2);
  box-shadow:var(--shadow-1);
}
.ther .tdays {
  font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--brand);
}
.ther .tname { font-size:16px; font-weight:700; margin-top:2px; }
.ther .tmail { font-size:13px; color:var(--ink-2); word-break:break-all; margin-top:2px; }
.ther .tmail a { color:inherit; }
.res-actions { display:flex; flex-wrap:wrap; gap:var(--sp-2); margin-top:var(--sp-3); }

/* ---------- help ---------- */
.help h2 { font-size:17px; margin:var(--sp-5) 0 var(--sp-2); }
.help ul { padding-left:20px; margin:0; }
.help li { margin:var(--sp-2) 0; font-size:14.5px; }
.help p { font-size:14.5px; max-width:66ch; }
.stamp { font-size:12.5px; color:var(--ink-3); border-top:1px solid var(--line);
  padding-top:var(--sp-3); margin-top:var(--sp-5); }
.syncline { font-size:12px; color:var(--ink-3); text-align:right; margin:var(--sp-5) 0 0; }

/* ---------- sign-in ---------- */
#lock { max-width:380px; margin:0 auto; padding:14vh var(--sp-4) var(--sp-6); }
#lock .card { padding:var(--sp-5); border-top:4px solid var(--brand); }
#lock h1 { font-size:22px; margin-bottom:var(--sp-1); }
#lock input {
  width:100%; min-height:52px; padding:0 var(--sp-4); margin:var(--sp-4) 0 var(--sp-2);
  font-size:17px; letter-spacing:.18em; text-align:center;
  border:1.5px solid var(--line-2); border-radius:var(--r);
  background:var(--bg); color:var(--ink);
}
#lock .btn { width:100%; }
.err { color:var(--bad); font-size:13.5px; min-height:20px; margin:var(--sp-2) 0 0; font-weight:600; }

/* ---------- toast ---------- */
#toast {
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--sp-5) + env(safe-area-inset-bottom)); z-index:60;
  max-width:min(520px, calc(100vw - 32px));
}
.toast {
  background:var(--ink); color:var(--bg); border-radius:var(--r);
  padding:var(--sp-3) var(--sp-4); font-size:14px; box-shadow:var(--shadow-2);
  animation:rise var(--dur) var(--ease);
}
@keyframes rise { from { opacity:0; transform:translateY(8px); } }

.hidden { display:none !important; }
#il-frame { display:block; width:100%; border:0; min-height:420px; background:transparent; }
.howto { padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-3); }
.howto summary { cursor:pointer; font-weight:700; color:var(--ink); min-height:var(--tap); display:flex; align-items:center; }
.howto summary::-webkit-details-marker { display:none; }
.howto summary::before { content:""; width:8px; height:8px; margin:0 10px 0 2px; border-right:2px solid var(--brand); border-bottom:2px solid var(--brand); transform:rotate(-45deg); transition:transform var(--dur) var(--ease); flex:0 0 auto; }
.howto[open] summary::before { transform:rotate(45deg); }
.howto ol { margin:var(--sp-2) 0 0; padding-left:var(--sp-5); font-size:14px; color:var(--ink-2); }
.howto li { margin:var(--sp-2) 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .chip:active, .day:active, .btn:active { transform:none; }
}
</style>
</head>
<body>

<!-- ============ sign in ============ -->
<div id="lock" class="hidden">
  <div class="card">
    <p class="brandline">McGill Martlets W-Basketball</p>
    <h1>Coverage Tracker</h1>
    <p class="muted" id="lockmsg">Enter your PIN. Lens gives you yours — it signs your name to
      every change, so keep it to yourself.</p>
    <label for="pass" class="muted" style="font-weight:600">PIN</label>
    <input id="pass" type="password" inputmode="numeric" autocomplete="current-password"
           autocapitalize="characters" spellcheck="false" placeholder="••••" aria-describedby="lockerr">
    <button class="btn primary" id="enter">Sign in</button>
    <p class="err" id="lockerr" role="alert"></p>
  </div>
</div>

<!-- ============ app ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-in">
      <p class="brandline">McGill Martlets Women's Basketball</p>
      <h1>Coverage Tracker — 2026-27</h1>
      <p class="idline">Signed in as <b id="whoami"></b> ·
        <button class="linkbtn" id="switch">Sign out</button></p>
      <div class="tabs" role="tablist" aria-label="Views" id="tabs">
        <button class="tab" role="tab" aria-selected="true"  data-t="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">Dashboard</span></button>
        <button class="tab" role="tab" aria-selected="false" data-t="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="lbl">Calendar</span></button>
        <button class="tab" role="tab" aria-selected="false" data-t="cov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="lbl">List</span></button>
        <button class="tab" role="tab" aria-selected="false" data-t="injury" id="tab-injury"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg><span class="lbl">Injury log</span></button>
        <button class="tab tab-2" role="tab" aria-selected="false" data-t="res"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span class="lbl">Resources</span></button>
        <button class="tab tab-2" role="tab" aria-selected="false" data-t="audit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span class="lbl">Activity</span></button>
        <button class="tab tab-2" role="tab" aria-selected="false" data-t="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span class="lbl">Help</span></button>
        <button class="more-btn" type="button" id="more-btn" aria-haspopup="true" aria-expanded="false" aria-controls="more-sheet" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span class="lbl">More</span></button>
      </div>
      <div id="more-sheet" class="hidden" role="group" aria-label="More views"></div>
    </div>
  </header>

  <main class="wrap">
    <div id="alertbar" aria-live="polite"></div>
    <div id="t-dash"  role="tabpanel" tabindex="-1"></div>
    <div id="t-cal"   role="tabpanel" tabindex="-1" class="hidden"></div>
    <div id="t-cov"   role="tabpanel" tabindex="-1" class="hidden"></div>
    <div id="t-res"   role="tabpanel" tabindex="-1" class="hidden"></div>
    <div id="t-audit" role="tabpanel" tabindex="-1" class="hidden"></div>
    <div id="t-help"  role="tabpanel" tabindex="-1" class="hidden help"></div>
    <div id="t-injury" role="tabpanel" tabindex="-1" class="hidden help"></div>
    <p class="syncline" id="sync"></p>
  </main>
</div>

<div id="toast" aria-live="assertive"></div>

<script>
"use strict";
var API = "https://fdybcqdavyezdvxehlee.supabase.co/functions/v1/tracker/api";
var S = null;               // server state
var ME = null;              // who the server says I am — never self-declared
var FILTER = "all";
// Temporary pause requested by Lens (2026-08-07). Keep the alert code in
// place so it can be restored without rebuilding the removal/audit flow.
var LOST_COVERAGE_ALERTS_ENABLED = false;
// Lens's injury-log module (clinical/injury-log/, its own schema) is served from
// injury/ in this repo and embedded in the Injury log tab. Same origin, so this page
// hands it the signed-in PIN by postMessage — nobody signs in twice. Empty = tab hidden.
var INJURY_LOG_URL = "injury/index.html?embed=1";

function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement("div"); d.textContent=(s==null?"":String(s)); return d.innerHTML; }
function myCode(){ return localStorage.getItem("mt_code") || ""; }

function post(body){
  body.code = myCode();
  return fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)})
    .then(function(r){ return r.json(); });
}

/* icons — inline SVG, never emoji, so they inherit colour and scale cleanly */
var SVG = {
  check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.6l3.1 3.1L13 4.8"/></svg>',
  cross: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg>',
  dot:   '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="2"/></svg>',
  left:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  warn:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L22 20H2L12 3.5z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/></svg>'
};

function toast(msg){
  var box = $("toast");
  box.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ box.innerHTML = ''; }, 4000);
}

/* ---------- derived ---------- */
function counts(ev){
  var n = 0;
  S.signups.forEach(function(s){ if (s.event_id === ev.id) n++; });
  return n;
}
function whoOn(ev){
  var names = [];
  S.signups.forEach(function(s){
    if (s.event_id === ev.id) {
      var p = S.people.find(function(x){ return x.id === s.person_id; });
      if (p) names.push(p.name);
    }
  });
  return names;
}

/* ---------- times & availability ---------- */
// "4-6pm" → 960 minutes. Returns null when the label isn't a real time.
function startMinutes(ev){
  var t = (ev.time_label || '').replace(/⚠️/g, '').trim();
  var m = t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
  if (!m) return null;
  var suffix = m[3] || (t.match(/(am|pm)/i) || [])[0] || '';
  var h = +m[1], min = +(m[2] || 0);
  if (!suffix) return null;
  suffix = suffix.toLowerCase();
  if (suffix === 'pm' && h !== 12) h += 12;
  if (suffix === 'am' && h === 12) h = 0;
  return h * 60 + min;
}
function fmtMinutes(v){
  var h = Math.floor(v / 60), m = v % 60, s = h >= 12 ? 'pm' : 'am';
  var hh = h % 12; if (hh === 0) hh = 12;
  return hh + (m ? ':' + (m < 10 ? '0' + m : m) : '') + s;
}
// Default arrival lead, in minutes. Practices: 30 minutes early. Home games:
// 1h30 before tip-off (Lens, 2026-10-10). Away games and anything whose
// location isn't confirmed get no default — Lens sets those per event.
function arrivalLead(ev){
  if (ev.etype === 'Practice') return 30;
  if (ev.etype === 'Game' && ev.home_away === 'Home') return 90;
  return null;
}
// A per-event call_time from Lens always wins over the default.
function callTime(ev){
  if (ev.call_time) return ev.call_time;
  var lead = arrivalLead(ev);
  if (lead === null) return '';
  var s = startMinutes(ev);
  return s === null ? '' : fmtMinutes(s - lead);
}
function status(ev){
  if (ev.min_needed === 0) return "ctx";
  var n = counts(ev);
  if (n === 0) return "uncovered";
  return n >= ev.min_needed ? "covered" : "partial";
}
function fmtDate(d){
  return new Date(d + "T12:00:00").toLocaleDateString("en-CA", {weekday:"short", month:"short", day:"numeric"});
}
function fmtDateLong(d){
  return new Date(d + "T12:00:00").toLocaleDateString("en-CA", {weekday:"long", month:"long", day:"numeric"});
}
function monthKey(d){ return d.slice(0,7); }
function monthLabel(d){
  return new Date(d + "T12:00:00").toLocaleDateString("en-CA", {month:"long", year:"numeric"});
}
// Local date, NOT toISOString() — that returns UTC, which rolls over to
// tomorrow after 8pm in Montreal and highlights the wrong day.
function isoLocal(d){
  var p = function(n){ return n < 10 ? '0' + n : '' + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function todayISO(){ return isoLocal(new Date()); }

// "2-4pm" → "2pm": the start often carries no am/pm, so borrow it from the end.
function startTime(ev){
  var t = (ev.time_label || '').replace(' ⚠️', '').trim();
  if (!t) return 'TBD';
  var parts = t.split('-');
  var start = parts[0].trim();
  if (parts.length > 1 && !/am|pm/i.test(start)) {
    var suffix = (parts[parts.length - 1].match(/am|pm/i) || [''])[0];
    if (suffix) start += suffix.toLowerCase();
  }
  return start;
}
function shortLabel(ev, max){
  var s = ev.detail;
  s = s.replace(/^Game\s+/, '');
  s = s.replace(/^Sport Physiotherapy Training Weekend/, 'Training');
  s = s.replace(/^Pre-Season Medicals.*/, 'Medicals');
  s = s.replace(/\s*⚠️/g, '');
  s = s.split(' — ')[0].split(' (')[0];
  max = max || 20;
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

/* ---------- shared rendering ---------- */
var LABEL = { uncovered:"Uncovered", partial:"Needs more", covered:"Covered", ctx:"No coverage needed" };
var TONE  = { uncovered:"b-bad", partial:"b-warn", covered:"b-ok", ctx:"b-gry" };

function badge(st){ return '<span class="badge ' + TONE[st] + '">' + LABEL[st] + '</span>'; }

function eventRow(ev, interactive){
  var st = status(ev);
  var major = ["Game","Tournament","Medicals","Training"].indexOf(ev.etype) !== -1;
  var h = '<article class="row st-' + st + (st === "ctx" ? " ctx" : "") + (major ? " major" : "") + '">';
  h += '<div class="rtop"><span class="rdate">' + esc(fmtDate(ev.date)) + '</span>';
  if (ev.time_label) h += '<span class="rtime">' + esc(ev.time_label) + '</span>';
  h += '<span class="rname">' + esc(ev.detail) + (ev.home_away ? ' · ' + esc(ev.home_away) : '') + '</span>';
  h += badge(st);
  if (st !== "ctx") h += '<span class="cnt tnum">' + counts(ev) + '/' + ev.min_needed + '</span>';
  h += '</div>';

  var call = callTime(ev), lead = ev.call_time ? null : arrivalLead(ev);
  if (call) h += '<p class="note"><b>Be there ' + esc(call) + '</b>' +
                 (lead === 90 ? ' — 1h30 before tip-off' : lead === 30 ? ' — 30 min before' : '') + '</p>';
  if (ev.notes) h += '<p class="note">' + esc(ev.notes) + '</p>';

  if (st !== "ctx" && interactive) {
    h += '<div class="chips">';
    S.people.forEach(function(p){
      var on = S.signups.some(function(s){ return s.event_id === ev.id && s.person_id === p.id; });
      var mine = ME && p.id === ME.id;
      var canTouch = ME && (ME.is_admin || mine);
      h += '<button class="chip' + (mine ? ' me' : '') + '" aria-pressed="' + (on ? 'true' : 'false') + '"' +
           (canTouch ? '' : ' disabled') +
           ' data-ev="' + ev.id + '" data-p="' + p.id + '"' +
           ' aria-label="' + esc(p.name) + (on ? ' is covering' : ' is not covering') + ' ' +
           esc(shortLabel(ev, 40)) + ' on ' + esc(fmtDate(ev.date)) + '">' +
           SVG.check + '<span>' + esc(p.name) + (p.standby ? ' *' : '') + '</span></button>';
    });
    h += '</div>';
  } else if (st !== "ctx") {
    var names = whoOn(ev);
    h += '<p class="note">Covering: ' + (names.length ? esc(names.join(", ")) : "nobody yet") + '</p>';
  }
  return h + '</article>';
}

/* ---------- dashboard ---------- */
function renderDash(){
  var need = S.events.filter(function(e){ return e.min_needed > 0; });
  var unc = need.filter(function(e){ return status(e) === "uncovered"; });
  var par = need.filter(function(e){ return status(e) === "partial"; });
  var cov = need.filter(function(e){ return status(e) === "covered"; });
  var today = todayISO();
  var wk = isoLocal(new Date(Date.now() + 7*864e5));
  var soon = need.filter(function(e){ return e.date >= today && e.date <= wk; });
  var soonBad = soon.filter(function(e){ return status(e) !== "covered"; });

  var h = '<div class="stats">' +
    '<div class="stat"><b class="tnum">' + need.length + '</b><span>Events</span></div>' +
    '<div class="stat bad"><b class="tnum">' + unc.length + '</b><span>Uncovered</span></div>' +
    '<div class="stat warn"><b class="tnum">' + par.length + '</b><span>Needs more</span></div>' +
    '<div class="stat ok"><b class="tnum">' + cov.length + '</b><span>Covered</span></div></div>';

  h += '<h2 class="sec">Next 7 days</h2>';
  if (!soon.length) {
    h += '<p class="muted">Nothing scheduled in the next week.</p>';
  } else {
    if (soonBad.length) {
      h += '<p class="muted">' + soonBad.length + ' of these ' +
           (soonBad.length > 1 ? 'still need' : 'still needs') + ' someone.</p>';
    }
    soon.forEach(function(e){ h += eventRow(e, true); });
  }

  h += '<h2 class="sec">Workload</h2><div class="tblwrap">' +
       '<table class="data"><thead><tr><th scope="col">Name</th>' +
       '<th scope="col" class="n">Events</th><th scope="col" class="n">Games</th>' +
       '</tr></thead><tbody>';
  S.people.forEach(function(p){
    var tot = 0, g = 0;
    S.signups.forEach(function(s){
      if (s.person_id !== p.id) return;
      tot++;
      var ev = S.events.find(function(e){ return e.id === s.event_id; });
      if (ev && (ev.etype === "Game" || ev.etype === "Tournament")) g++;
    });
    h += '<tr><th scope="row" style="font-weight:600">' + esc(p.name) +
         (p.standby ? ' (standby)' : '') + '</th>' +
         '<td class="n">' + tot + '</td><td class="n">' + g + '</td></tr>';
  });
  h += '</tbody></table></div>';
  $("t-dash").innerHTML = h;
}

/* ---------- list ---------- */
function renderCov(){
  var opts = [["all","All"],["games","Games"],["uncovered","Gaps only"],["mine","Mine"]];
  var h = '<div class="filters" role="group" aria-label="Filter events">';
  opts.forEach(function(o){
    h += '<button class="fbtn" aria-pressed="' + (FILTER === o[0]) + '" data-f="' + o[0] + '">' +
         o[1] + '</button>';
  });
  h += '</div>';

  var meId = ME ? ME.id : -1;
  var evs = S.events.filter(function(e){
    if (FILTER === "games") return e.etype === "Game" || e.etype === "Tournament";
    if (FILTER === "uncovered") return e.min_needed > 0 && status(e) !== "covered";
    if (FILTER === "mine") return S.signups.some(function(s){ return s.event_id === e.id && s.person_id === meId; });
    return true;
  });

  var lastM = "";
  evs.forEach(function(e){
    var mk = monthKey(e.date);
    if (mk !== lastM) {
      lastM = mk;
      var inMonth = evs.filter(function(x){ return monthKey(x.date) === mk && x.min_needed > 0; });
      var bad = inMonth.filter(function(x){ return status(x) !== "covered"; });
      h += '<div class="mh"><h2>' + esc(monthLabel(e.date)) + '</h2><span class="mstat">' +
           inMonth.length + ' to cover · ' + bad.length + ' open</span></div>';
    }
    h += eventRow(e, true);
  });
  if (!evs.length) {
    h += '<p class="muted">' + (FILTER === "mine"
         ? "You haven't signed up for anything yet. Try the Gaps filter to find something."
         : "Nothing matches this filter.") + '</p>';
  }
  $("t-cov").innerHTML = h;
}

/* ---------- calendar ---------- */
var CAL_MONTH = null;   // "YYYY-MM"
var CAL_DAY = null;     // selected date, drives the detail panel

function monthList(){
  var out = [];
  S.events.forEach(function(e){
    var m = monthKey(e.date);
    if (out.indexOf(m) === -1) out.push(m);
  });
  return out.sort();
}
// Worst status wins, so a day with one uncovered event reads as uncovered.
function dayStatus(evs){
  var order = ["uncovered","partial","covered","ctx"];
  var best = null;
  evs.forEach(function(e){
    var st = status(e);
    if (best === null || order.indexOf(st) < order.indexOf(best)) best = st;
  });
  return best;
}

function renderCal(){
  var months = monthList();
  if (!months.length) { $("t-cal").innerHTML = '<p class="muted">No events yet.</p>'; return; }
  if (!CAL_MONTH || months.indexOf(CAL_MONTH) === -1) {
    var tm = todayISO().slice(0,7);
    CAL_MONTH = months.indexOf(tm) !== -1 ? tm : months[0];
  }
  var idx = months.indexOf(CAL_MONTH);
  var y = +CAL_MONTH.slice(0,4), m = +CAL_MONTH.slice(5,7);
  var first = new Date(y, m - 1, 1);
  var daysInMonth = new Date(y, m, 0).getDate();
  var lead = first.getDay();

  var h = '<div class="cal-top">' +
    '<button class="iconbtn" data-mo="prev"' + (idx === 0 ? ' disabled' : '') +
      ' aria-label="Previous month">' + SVG.left + '</button>' +
    '<h2>' + first.toLocaleDateString("en-CA", {month:"long", year:"numeric"}) + '</h2>' +
    '<button class="iconbtn" data-mo="next"' + (idx === months.length - 1 ? ' disabled' : '') +
      ' aria-label="Next month">' + SVG.right + '</button></div>';

  h += '<div class="cal-grid" role="grid" aria-label="' +
       esc(first.toLocaleDateString("en-CA", {month:"long", year:"numeric"})) + '">';
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(function(d){
    h += '<div class="cal-h" role="columnheader">' + d + '</div>';
  });
  for (var i = 0; i < lead; i++) h += '<div class="day empty" aria-hidden="true"></div>';

  var today = todayISO();
  for (var day = 1; day <= daysInMonth; day++) {
    var iso = CAL_MONTH + '-' + (day < 10 ? '0' + day : day);
    var evs = S.events.filter(function(e){ return e.date === iso; });
    var st = dayStatus(evs);
    var needing = evs.filter(function(e){ return e.min_needed > 0; });
    var cls = 'day' + (st ? ' st-' + st : ' none') + (iso === today ? ' today' : '');
    var label = fmtDateLong(iso) + (evs.length
      ? ', ' + evs.length + (evs.length > 1 ? ' events' : ' event') +
        (needing.length ? ', ' + LABEL[st] : ', no coverage needed')
      : ', nothing scheduled');

    h += '<button class="' + cls + '"' + (evs.length ? '' : ' disabled') +
         ' data-day="' + iso + '" aria-pressed="' + (CAL_DAY === iso) + '"' +
         ' aria-label="' + esc(label) + '">' +
         '<span class="dnum tnum" aria-hidden="true">' + day + '</span>';
    if (evs.length) {
      var lead2 = needing[0] || evs[0];
      var major = ["Game","Tournament","Medicals","Training"].indexOf(lead2.etype) !== -1;
      h += '<span class="dline" aria-hidden="true">' +
           esc(lead2.min_needed > 0 ? startTime(lead2) : shortLabel(lead2, 8)) + '</span>';
      // Only name the event when it isn't a routine practice — otherwise every
      // cell reads "Pract…" and the label earns nothing.
      if (major) h += '<span class="dline" aria-hidden="true"><b>' +
                      esc(shortLabel(lead2, 9)) + '</b></span>';
      if (needing.length) {
        var totC = 0, totN = 0;
        needing.forEach(function(e){ totC += counts(e); totN += e.min_needed; });
        h += '<span class="dcount tnum" aria-hidden="true">' + totC + '/' + totN +
             (evs.length > 1 ? ' ·' + evs.length : '') + '</span>';
      }
    }
    h += '</button>';
  }
  h += '</div>';

  h += '<div class="legend">' +
    '<span class="lg bad"><i></i>Nobody</span>' +
    '<span class="lg warn"><i></i>Below minimum</span>' +
    '<span class="lg ok"><i></i>Covered</span>' +
    '<span class="lg gry"><i></i>No coverage needed</span></div>' +
    '<p class="muted tight">Tap a day to open it and sign up.</p>';

  if (CAL_DAY) {
    var dayEvs = S.events.filter(function(e){ return e.date === CAL_DAY; });
    if (dayEvs.length) {
      h += '<section class="cal-detail"><h3>' + esc(fmtDateLong(CAL_DAY)) + '</h3>';
      dayEvs.forEach(function(e){ h += eventRow(e, true); });
      h += '</section>';
    }
  }
  $("t-cal").innerHTML = h;
}

/* ---------- alert ---------- */
function renderAlert(){
  if (!LOST_COVERAGE_ALERTS_ENABLED) { $("alertbar").innerHTML = ''; return; }
  var lost = S.audit.filter(function(a){
    return a.action === 'removed' && a.covered_after < a.min_needed &&
           (Date.now() - new Date(a.at).getTime()) < 48 * 3600 * 1000;
  }).slice(0, 4);
  if (!lost.length) { $("alertbar").innerHTML = ''; return; }
  var h = '<div class="urgent" role="alert">' + SVG.warn + '<div><b>Coverage dropped — these need someone</b><ul>';
  lost.forEach(function(a){
    h += '<li>' + esc(a.event_label) + ' — now ' + a.covered_after + '/' + a.min_needed +
         (a.covered_after === 0 ? ' (nobody)' : '') + ', ' + esc(a.person) + ' came off</li>';
  });
  $("alertbar").innerHTML = h + '</ul></div></div>';
}

function when(iso){
  return new Date(iso).toLocaleString("en-CA",
    {timeZone:"America/Toronto", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}
function renderAudit(){
  var h = '<h2 class="sec">Every change, newest first</h2>';
  if (!S.audit.length) h += '<p class="muted">No changes yet.</p>';
  S.audit.forEach(function(a){
    var bad = a.action === "removed" && a.covered_after < a.min_needed;
    h += '<div class="audit-item' + (bad ? " bad" : "") + '">' +
      '<b>' + esc(a.person) + '</b> ' + (a.action === "added" ? "signed up for" : "came off") +
      ' <b>' + esc(a.event_label) + '</b> → now ' + a.covered_after + '/' + a.min_needed +
      '<span class="audit-when">' + when(a.at) +
      (a.actor && a.actor !== a.person ? ' · changed by ' + esc(a.actor) : '') + '</span></div>';
  });
  $("t-audit").innerHTML = h;
}

/* ---------- resources ---------- */
// Contact details arrive from the server after sign-in, same as the roster —
// nothing personal is baked into this public file.
function telHref(p){ return 'tel:+1' + String(p || '').replace(/\D/g, ''); }
function smsHref(p){ return 'sms:+1' + String(p || '').replace(/\D/g, ''); }

function renderRes(){
  var R = S.resources;
  if (!R) {
    $("t-res").innerHTML = '<p class="muted" style="margin-top:16px">Resources haven’t been set up yet — ask Lens.</p>';

  }
  var h = '<h2 class="sec">Emergency</h2>' +
    '<div class="urgent">' + SVG.warn + '<div>' +
    '<b>Need an ambulance? Call McGill Security</b>' +
    '<p class="note" style="margin:4px 0 0">If you need to call an ambulance, you call Security. ' +
    'Then call the clinic therapist on duty (below) and let them know what’s happening.</p>' +
    '<div class="res-actions"><a class="btn primary" href="' + esc(telHref(R.security_phone)) + '">' +
    'Call Security · ' + esc(R.security_phone || '') + '</a></div>' +
    '</div></div>';

  h += '<h2 class="sec">Player got hurt? Report it</h2>' +
    '<p class="res-intro">Whenever a player gets hurt, whoever is covering fills out the injury ' +

    h += '<div class="res-actions" style="margin-top:8px"><a class="btn primary" href="' +

  }

  // Player status: a pointer to the team's SharePoint workbook. Only the link

      '<div class="res-actions" style="margin-top:8px"><a class="btn primary" href="' +
      esc(R.player_status_url) + '" target="_blank" rel="noopener">Open the player status list</a></div>' +
      '<p class="note" style="margin:4px 0 0">Opens with your McGill login — if it says you ' +
      'don’t have access, tell Lens.</p>';
  }

  h += '<h2 class="sec">Winsor Clinic therapists</h2>' +
    '<p class="res-intro">When you’re covering a practice and Lens isn’t there, a Winsor Clinic ' +
    'therapist is on site on the days below — and there is <b>always someone on call</b> if you need help.</p>' +
    '<ul style="padding-left:20px;margin:0 0 8px;font-size:14.5px">' +
    '<li style="margin:6px 0"><b>Non-urgent</b> — text them. Someone will come by and triage; if they’re ' +
    'on something more serious first, they will still get to you.</li>' +
    '<li style="margin:6px 0"><b>Urgent</b> — call them.</li>' +
    '<li style="margin:6px 0"><b>Emergency</b> — call and let them know right away.</li>' +
    '<li style="margin:6px 0">Feel free to text them and introduce yourself — they’re here to help.</li>' +
    '</ul>';

  (R.therapists || []).forEach(function(t){
    h += '<div class="ther">' +
      '<div class="tdays">' + esc(t.days) + '</div>' +
      '<div class="tname">' + esc(t.name) + '</div>' +
      '<div class="tmail"><a href="mailto:' + esc(t.email) + '">' + esc(t.email) + '</a></div>' +
      '<div class="res-actions">' +
      '<a class="btn" href="' + esc(smsHref(t.phone)) + '">Text · ' + esc(t.phone) + '</a>' +
      '<a class="btn" href="' + esc(telHref(t.phone)) + '">Call</a>' +
      '</div></div>';
  });

  // Coordinator-only links: the server strips staff_links for non-admin PINs,
  // so this section can only ever render for Lens.
  if (ME && ME.is_admin && (R.staff_links || []).length) {
    h += '<h2 class="sec">Coordinator links</h2>' +
      '<p class="res-intro">Visible to you only.</p>';
    R.staff_links.forEach(function(l){
      h += '<div class="res-actions" style="margin-top:8px"><a class="btn" href="' +
        esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a></div>';
      if (l.note) h += '<p class="note" style="margin:4px 0 0">' + esc(l.note) + '</p>';
    });
  }

  h += '<p class="stamp">Contacts and procedures provided by Lens · ' + esc(R.updated || '') + '</p>';
  $("t-res").innerHTML = h;
}

    '<li>Coming off something already covered asks you to confirm because it may leave the event below its minimum. Do it as early as you can.</li>' +
    '<li>Your PIN is personal — it signs your name to every change. Lost it? Lens can issue a new one.</li>' +
    '<li>⚠️ in an event means that detail isn’t confirmed yet. Don’t plan around it.</li>' +

    '</ul>' +

    '<p>Anything you sign up for lands on your own calendar by itself, usually within five ' +

    '<p class="stamp">Schedule source: August 2026 and Fall 2026 team calendars provided by Lens, ' +
    'transcribed 2026-08-01. Winter 2027 will be added when published.</p>';
}

var IL_FRAME = null, IL_READY = false;
function ilSend(msg){ if (IL_FRAME && IL_FRAME.contentWindow) { try { IL_FRAME.contentWindow.postMessage(msg, location.origin); } catch(e){} } }
function ilAuth(){ if (IL_READY && myCode()) ilSend({ type:"il-auth", pass: myCode() }); }
function renderInjury(){
  $("tab-injury").classList.toggle("hidden", !INJURY_LOG_URL);
  if (!INJURY_LOG_URL) return;
  if (!IL_FRAME) {
    // Built once: rebuilding on every refresh would reload the embedded page.
    $("t-injury").innerHTML =
      '<details class="card howto"><summary>How to use the injury log</summary>' +
      '<ol>' +
      '<li><b>Use it instead of texting Lens.</b> Every taping, assessment, treatment or rehab session goes here, the same day.</li>' +
      '<li><b>New entry:</b> check the date, tap the microphone (in the app or on your keyboard) and talk: <b>who</b> (the athlete\'s name), what happened, what you found, what you did. One message can cover several athletes and several things — a taping, then a release — in a row.</li>' +
      '<li><b>Generate with AI</b> splits your words into one entry per athlete and per thing done, picks the type (taping, assessment, treatment, rehab) and fills S / O / A / P with your own words only. Check each card, fix anything, then <b>Save all</b>.</li>' +
      '<li><b>Log:</b> filter by athlete, type, date or a word, or tap an athlete\'s name to see everything about her. Export to Excel any time.</li>' +
      '<li><b>Confidential.</b> Team medical staff only; no screenshots, no sharing. Anything urgent is still a call.</li>' +
      '</ol></details>' +
      '<iframe id="il-frame" title="Injury log" src="' + esc(INJURY_LOG_URL) + '" scrolling="no" allow="microphone"></iframe>';
    IL_FRAME = $("il-frame");
  }
  ilAuth();
}
window.addEventListener("message", function(ev){
  if (ev.origin !== location.origin || !ev.data) return;
  if (ev.data.type === "il-ready") { IL_READY = true; ilAuth(); }
  else if (ev.data.type === "il-height" && IL_FRAME) IL_FRAME.style.height = Math.max(420, (ev.data.h | 0) + 8) + "px";
});
function renderAll(){
  if (!S) return;
  renderAlert(); renderDash(); renderCal(); renderCov(); renderRes(); renderAudit(); renderHelp(); renderInjury();
  $("whoami").textContent = ME ? (ME.name + (ME.is_admin ? " (coordinator)" : "")) : "";
  $("sync").textContent = "Updated " + when(S.now);
}

/* ---------- interactions ---------- */
/* Bottom bar on phones: secondary tabs live in the "More" sheet. One set of
   buttons, moved between the strip and the sheet as the viewport changes. */
var MOBILE_NAV = window.matchMedia("(max-width:640px)");
function closeMore(){ $("more-sheet").classList.add("hidden"); $("more-btn").setAttribute("aria-expanded", "false"); }
function syncMore(){
  var active = document.querySelector('#more-sheet .tab[aria-selected="true"]');
  $("more-btn").setAttribute("aria-selected", active ? "true" : "false");
}
function layoutTabs(){
  var strip = $("tabs"), sheet = $("more-sheet"), more = $("more-btn");
  var secondary = Array.prototype.slice.call(document.querySelectorAll(".tab.tab-2"));
  if (MOBILE_NAV.matches) secondary.forEach(function(b){ sheet.appendChild(b); });
  else { secondary.forEach(function(b){ strip.insertBefore(b, more); }); closeMore(); }
  syncMore();
}
layoutTabs();
(MOBILE_NAV.addEventListener ? MOBILE_NAV.addEventListener("change", layoutTabs) : MOBILE_NAV.addListener(layoutTabs));

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.closest && t.closest("#more-btn")) {
    var open = $("more-sheet").classList.toggle("hidden");
    $("more-btn").setAttribute("aria-expanded", open ? "false" : "true");
    return;
  }
  if (!(t.closest && t.closest("#more-sheet"))) closeMore();
  var tab = t.closest && t.closest(".tab");
  if (tab) {
    document.querySelectorAll(".tab").forEach(function(x){ x.setAttribute("aria-selected", "false"); });
    tab.setAttribute("aria-selected", "true");
    ["dash","cal","cov","res","audit","help","injury"].forEach(function(k){
      $("t-"+k).classList.toggle("hidden", k !== tab.dataset.t);
    });
    closeMore(); syncMore();
    $("t-" + tab.dataset.t).focus({ preventScroll:true });
    return;
  }

  var fb = t.closest && t.closest(".fbtn");
  if (fb) { FILTER = fb.dataset.f; renderCov(); return; }

  var nav = t.closest && t.closest("[data-mo]");
  if (nav && !nav.disabled) {
    var months = monthList(), i = months.indexOf(CAL_MONTH);
    CAL_MONTH = months[nav.dataset.mo === "prev" ? i - 1 : i + 1] || CAL_MONTH;
    CAL_DAY = null;
    renderCal();
    return;
  }

  var day = t.closest && t.closest(".day");
  if (day && day.dataset.day && !day.disabled) {
    CAL_DAY = (CAL_DAY === day.dataset.day) ? null : day.dataset.day;
    renderCal();
    var panel = document.querySelector(".cal-detail");
    if (panel) panel.scrollIntoView({ block:"nearest", behavior:"smooth" });
    return;
  }

  var chip = t.closest && t.closest(".chip");
  if (chip && chip.dataset.ev && !chip.disabled) {
    var on = chip.getAttribute("aria-pressed") === "true";
    var removalLeavesGap = false;
    // Coming off an event that is currently covered may leave a hole. Make that
    // consequence explicit before saving the removal.
    if (on) {
      var ev = S.events.find(function(x){ return x.id === +chip.dataset.ev; });
      if (ev && counts(ev) <= ev.min_needed) {
        removalLeavesGap = true;
        var whose = (+chip.dataset.p === (ME && ME.id)) ? "your name" : "this name";
        var msg = "This event is currently covered.\n\n" +
          fmtDate(ev.date) + " · " + (ev.time_label || "") + " — " + ev.detail + "\n\n" +
          "If you take " + whose + " off, it drops to " + (counts(ev) - 1) + "/" + ev.min_needed +
          " and leaves the event below its coverage minimum.\n\n" +
          "Only do this if you genuinely can't be there. Remove anyway?";
        if (!confirm(msg)) return;
      }
    }
    chip.disabled = true; chip.classList.add("pending");
    post({action:"toggle", event_id:+chip.dataset.ev, person_id:+chip.dataset.p, on:!on})
      .then(function(r){
        if (r.ok) {
          S = r.state; ME = r.me || ME; renderAll();
          toast(on ? (removalLeavesGap ? "Removed. The event is now below its coverage minimum." : "Removed.")
                   : "You're on. Thanks.");
        } else if (r.error === "bad_code") { lock("Your PIN no longer works — ask Lens.");
        } else {
          chip.disabled = false; chip.classList.remove("pending");
          toast(r.error === "not_allowed" ? "Only Lens can change someone else's name."
                                          : "That didn't save. Try again.");
        }
      })
      .catch(function(){
        chip.disabled = false; chip.classList.remove("pending");
        toast("No connection — nothing was saved.");
      });
    return;
  }

  if (t.closest && t.closest("#switch")) {
    localStorage.removeItem("mt_code"); ME = null; S = null; ilSend({ type:"il-signout" }); lock(); return;
  }

});

/* ---------- sign in / boot ---------- */
function lock(msg){
  $("app").classList.add("hidden");
  $("lock").classList.remove("hidden");
  $("lockerr").textContent = msg || "";
  $("pass").value = "";
  $("pass").focus();
}
$("enter").onclick = function(){
  var v = $("pass").value.trim().toUpperCase();
  if (!v) { $("lockerr").textContent = "Enter your PIN."; return; }
  localStorage.setItem("mt_code", v);
  $("lockerr").textContent = "Checking…";
  boot();
};
$("pass").addEventListener("keydown", function(e){ if (e.key === "Enter") $("enter").click(); });

function boot(){
  post({action:"state"}).then(function(r){
    if (!r.ok) {
      localStorage.removeItem("mt_code");
      lock(r.error === "bad_code" ? "That PIN isn't recognised."
         : r.error === "locked_out" ? "Too many wrong tries — wait 15 minutes."
         : "Something went wrong: " + r.error);
      return;
    }
    S = r.state; ME = r.me;
    $("lock").classList.add("hidden");
    $("app").classList.remove("hidden");
    renderAll();
  }).catch(function(){ lock("No connection — try again."); });
}
function refresh(){
  if (!S || document.hidden) return;
  post({action:"state"}).then(function(r){ if (r.ok) { S = r.state; ME = r.me || ME; renderAll(); } });
}
setInterval(refresh, 15000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) refresh(); });
if (myCode()) boot(); else lock();
</script>
